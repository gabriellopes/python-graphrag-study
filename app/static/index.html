<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Semantic Brain | Deterministic Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0b0f19; color: #e2e8f0; }
        .code-font { font-family: 'Fira Code', monospace; }
        .glow-border { box-shadow: 0 0 15px rgba(59, 130, 246, 0.2); }
    </style>
</head>
<body class="min-h-screen p-6 flex flex-col items-center">

    <!-- Header -->
    <header class="w-full max-w-6xl flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-blue-400 to-emerald-400 bg-clip-text text-transparent">
                Python Semantic Brain <span class="text-xs px-2 py-1 bg-blue-900/50 text-blue-300 rounded border border-blue-700">GraphRAG + SHACL + Z3</span>
            </h1>
            <p class="text-xs text-gray-400 mt-1">Deterministic Code Synthesis & Formal Verification Architecture</p>
        </div>
        <div id="status-pill" class="flex items-center space-x-2 bg-emerald-950/60 border border-emerald-800 text-emerald-400 px-3 py-1 rounded-full text-xs font-semibold">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>SYSTEM ONLINE</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Input Panel -->
        <section class="lg:col-span-5 bg-gray-900/80 border border-gray-800 rounded-xl p-5 glow-border flex flex-col">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400 mb-3 flex items-center justify-between">
                <span>Code Input & Intent</span>
                <span class="text-xs text-blue-400 code-font">ex:Problem5_6</span>
            </h2>
            <textarea id="code-input" class="w-full flex-grow h-64 bg-gray-950 text-emerald-400 code-font text-xs p-3 rounded-lg border border-gray-800 focus:border-blue-500 focus:outline-none resize-none leading-relaxed" spellcheck="false">
def check_bounds(val: int) -> bool:
    """
    Formulate pre/post-conditions into Z3 SMT constraints
    to check satisfiability before execution.
    """
    return val >= 0 and val <= 100
            </textarea>

            <button id="run-btn" onclick="executePipeline()" class="mt-4 w-full bg-gradient-to-r from-blue-600 to-emerald-600 hover:from-blue-500 hover:to-emerald-500 text-white font-semibold py-2.5 px-4 rounded-lg text-sm transition-all shadow-lg flex items-center justify-center space-x-2">
                <span>Execute Semantic Verification Pipeline</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
        </section>

        <!-- Pipeline DAG Plot View -->
        <section class="lg:col-span-7 bg-gray-900/80 border border-gray-800 rounded-xl p-5 glow-border">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-gray-400">
                    Execution Pipeline Plot
                </h2>
                <span id="latency-tag" class="text-xs code-font text-gray-500">Total Latency: -- ms</span>
            </div>

            <!-- Pipeline Cards Stack -->
            <div id="pipeline-stack" class="space-y-3">
                <div class="p-3 bg-gray-950/60 border border-gray-800 rounded-lg text-xs text-gray-500 text-center py-12">
                    Click "Execute Semantic Verification Pipeline" to plot real-time execution steps.
                </div>
            </div>
        </section>
    </main>

    <script>
        async function executePipeline() {
            const btn = document.getElementById("run-btn");
            const stack = document.getElementById("pipeline-stack");
            const latencyTag = document.getElementById("latency-tag");
            const code = document.getElementById("code-input").value;

            btn.disabled = true;
            btn.classList.add("opacity-50");
            stack.innerHTML = `<div class="p-8 text-center text-xs text-blue-400 animate-pulse">Running AST parsing, SHACL validation, and Z3 SMT logic solver...</div>`;

            try {
                const res = await fetch("/api/v1/synthesize", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ code_input: code, problem_id: "ex:Problem5_6" })
                });

                const data = await res.json();
                latencyTag.innerText = `Total Latency: ${data.total_latency_ms} ms`;
                stack.innerHTML = "";

                data.pipeline_trace.forEach((step, idx) => {
                    const isLast = idx === data.pipeline_trace.length - 1;
                    const card = document.createElement("div");
                    card.className = "p-3.5 bg-gray-950 border border-gray-800 rounded-lg relative transition-all hover:border-gray-700";
                    
                    card.innerHTML = `
                        <div class="flex justify-between items-center mb-1">
                            <div class="flex items-center space-x-2">
                                <span class="w-5 h-5 rounded-full bg-blue-900/60 text-blue-400 border border-blue-700 flex items-center justify-center text-[10px] font-bold">${step.step_number}</span>
                                <h3 class="text-xs font-semibold text-gray-200">${step.step_name}</h3>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-[10px] code-font text-gray-500">${step.latency_ms} ms</span>
                                <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-emerald-950 text-emerald-400 border border-emerald-800">${step.status}</span>
                            </div>
                        </div>
                        <p class="text-[11px] text-gray-400 pl-7 leading-relaxed">${step.details}</p>
                    `;
                    stack.appendChild(card);
                });

            } catch (err) {
                stack.innerHTML = `<div class="p-4 bg-red-950/50 border border-red-800 text-red-300 rounded-lg text-xs">Pipeline Execution Error: ${err.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.classList.remove("opacity-50");
            }
        }
    </script>
</body>
</html>
